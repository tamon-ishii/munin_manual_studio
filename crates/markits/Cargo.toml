[package]
name = "markits"
version = "0.7.0"
edition = "2024"

[workspace]
members = [
    ".",
    "apps/desktop/src-tauri",
]

[lib]
name = "markits"
path = "src/lib.rs"

[[bin]]
name = "markits"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
screenshots = "0.8.10"
xa11y = { version = "0.15.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
zbus = { version = "5", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
