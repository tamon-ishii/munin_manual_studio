<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <filter id="markits-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowhead-primary" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-secondary" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4b5563" />
    </marker>
    <marker id="arrowhead-warning" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrowhead-danger" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowhead-info" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrowhead-step" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    <mask id="spotlight-mask-0">
      <rect width="100%" height="100%" fill="white"/>
      <rect x="80" y="80" width="320" height="140" rx="6" ry="6" fill="black"/>
    </mask>
  </defs>
  <!-- Spotlight -->
  <rect width="100%" height="100%" fill="#000000" opacity="0.65" mask="url(#spotlight-mask-0)"/>
  <rect x="80" y="80" width="320" height="140" rx="6" ry="6" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4 3"/>
  <rect x="80" y="80" width="320" height="140" rx="8" ry="8" fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="600" y="80" width="280" height="120" fill="rgba(217, 119, 6, 0.15)" stroke="#d97706" stroke-width="2.5"/>
  <ellipse cx="220" cy="490" rx="70" ry="70" fill="rgba(220, 38, 38, 0.15)" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="134" y1="490" x2="150" y2="490" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead-danger)"/>
  <rect x="600" y="420" width="260" height="90" rx="6" ry="8" fill="rgba(2, 132, 199, 0.15)" stroke="#0284c7" stroke-width="2.5"/>
  <g filter="url(#markits-shadow)">
    <circle cx="58" cy="58" r="14" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
    <text x="58" y="58" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.6" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text>
  </g>
  <line x1="240" y1="236" x2="240" y2="220" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead-primary)"/>
  <g filter="url(#markits-shadow)">
    <rect x="91.50000000000003" y="236" width="296.99999999999994" height="30.900000000000002" rx="6" ry="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
    <text x="240" y="251.45" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">① メイン検索エリアにキーワードを入力</text>
  </g>
  <g filter="url(#markits-shadow)">
    <rect x="602" y="33.099999999999994" width="275.9999999999999" height="30.900000000000002" rx="6" ry="6" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
    <text x="740" y="48.55" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">注意: 必須項目の入力が漏れています</text>
  </g>
  <line x1="220" y1="576" x2="220" y2="560" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead-danger)"/>
  <g filter="url(#markits-shadow)">
    <rect x="104.05000000000003" y="576" width="231.89999999999995" height="30.900000000000002" rx="6" ry="6" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
    <text x="220" y="591.45" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">危険: 取り消し不可の削除操作</text>
  </g>
  <g filter="url(#markits-shadow)">
    <circle cx="578" cy="398" r="14" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
    <text x="578" y="398" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.6" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text>
  </g>
  <line x1="876" y1="465" x2="860" y2="465" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead-info)"/>
  <g filter="url(#markits-shadow)">
    <rect x="876" y="449.55" width="179.4" height="30.900000000000002" rx="6" ry="6" fill="#0284c7" stroke="#0284c7" stroke-width="1.5"/>
    <text x="965.7" y="465" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">② 設定を適用して保存</text>
