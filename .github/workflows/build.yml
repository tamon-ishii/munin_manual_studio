name: Build and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crates/markits/apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libxtst-dev libxrandr-dev libxcb1-dev libdbus-1-dev libclang-dev pkg-config
      - name: Install frontend dependencies
        run: |
          npm ci
          npm ci --prefix crates/markits/apps/desktop
      - name: Build frontends and check workflow logic
        run: |
          npm run manual:build
          npm run manual:build-markits
          npm run manual:test-workflow
      - name: Test native Rust code and release layouts
        run: |
          cargo test --locked -p manual-core -p manual-studio
          python -m unittest discover -s scripts -p "test_package_release.py"
      - name: Build Manual Studio and CLI
        run: cargo build --locked --release --target ${{ matrix.target }} -p manual-studio -p manual-core
      - name: Build MarkIts Desktop
        run: cargo build --locked --release --manifest-path crates/markits/Cargo.toml --target-dir target --target ${{ matrix.target }} -p markits-desktop --features tauri/custom-protocol
      - name: Package applications
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/package_release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: manual-studio-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Munin Manual Studio $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip --clobber
