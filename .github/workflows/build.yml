name: Build and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_matrix:
        description: Optional JSON matrix include entries for targeted verification
        type: string
        default: ''
      windows_native_smoke:
        description: Run real Windows recording and MarkIts window checks
        type: boolean
        default: false
      macos_native_smoke:
        description: Run real macOS recording and MarkIts window checks
        type: boolean
        default: false
      windows_scale_smoke:
        description: Change real Windows display settings and verify 150/200 percent DPI
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_matrix || '[{"runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","platform":"linux-x64"},{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","platform":"windows-x64"},{"runner":"macos-latest","target":"aarch64-apple-darwin","platform":"macos-arm64"},{"runner":"macos-latest","target":"x86_64-apple-darwin","platform":"macos-x64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crates/markits/apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libxtst-dev libxrandr-dev libxcb1-dev libdbus-1-dev libclang-dev pkg-config
      - name: Install frontend dependencies
        run: |
          npm ci
          npm ci --prefix crates/markits/apps/desktop
      - name: Build frontends and check workflow logic
        run: |
          npm run manual:build
          npm run manual:test-workflow
      - name: Test native Rust code and release layouts
        run: |
          cargo test --locked -p manual-core -p manual-studio
          python -m unittest discover -s scripts -p "test_package_release.py"
      - name: Prepare Windows native checks
        id: windows_native_build
        if: runner.os == 'Windows' && inputs.windows_native_smoke
        shell: pwsh
        run: |
          python -m pip install mkdocs-material
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import platform, tkinter; print(platform.platform()); print('Tk', tkinter.TkVersion)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p manual-studio -p manual-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check real Windows recording and MarkIts windows
        if: runner.os == 'Windows' && inputs.windows_native_smoke
        shell: pwsh
        run: |
          npm run manual:smoke-native 2>&1 | Tee-Object -FilePath windows-native-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Studio in real Windows WebView2
        if: always() && runner.os == 'Windows' && inputs.windows_native_smoke && steps.windows_native_build.outcome == 'success'
        shell: pwsh
        run: |
          node scripts/test_manual_studio_webview2.mjs 2>&1 | Tee-Object -FilePath windows-webview2.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows native check log
        if: always() && runner.os == 'Windows' && inputs.windows_native_smoke
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-smoke-log
          path: |
            windows-native-smoke.log
            windows-webview2.log
            webview2-results/
            native-smoke-results/
          if-no-files-found: warn
      - name: Check real Windows display scales
        if: runner.os == 'Windows' && inputs.windows_scale_smoke && steps.windows_native_build.outcome == 'success'
        shell: pwsh
        run: |
          try {
            foreach ($scale in @(150, 200)) {
              & scripts/set_native_windows_scale.ps1 -Scale $scale
              $env:MANUAL_WEBVIEW2_EXPECTED_DPI = [string]($scale * 96 / 100)
              $env:MANUAL_WEBVIEW2_RESULTS = "webview2-results/$scale"
              node scripts/test_manual_studio_webview2.mjs
              if ($LASTEXITCODE -ne 0) { throw "WebView2 check failed at $scale percent" }
            }
          } finally {
            try { & scripts/set_native_windows_scale.ps1 -Scale 100 } catch { Write-Warning $_ }
          }
      - name: Save Windows scale check evidence
        if: always() && runner.os == 'Windows' && inputs.windows_scale_smoke
        uses: actions/upload-artifact@v4
        with:
          name: windows-scale-smoke-results
          path: |
            webview2-results/
            native-smoke-results/
          if-no-files-found: warn
      - name: Prepare macOS native checks
        id: macos_native_build
        if: runner.os == 'macOS' && inputs.macos_native_smoke
        run: |
          python -m pip install mkdocs-material
          python -c "import platform, tkinter; print(platform.platform()); print('Tk', tkinter.TkVersion)"
          cargo build --locked -p manual-studio -p manual-core
      - name: Check real macOS recording and MarkIts windows
        if: runner.os == 'macOS' && inputs.macos_native_smoke
        env:
          MANUAL_NATIVE_PYTHON: python
        shell: bash
        run: |
          set -o pipefail
          npm run manual:smoke-native 2>&1 | tee macos-native-smoke.log
      - name: Check real macOS Studio UI workflow
        if: always() && runner.os == 'macOS' && inputs.macos_native_smoke && steps.macos_native_build.outcome == 'success'
        env:
          MANUAL_NATIVE_PYTHON: python
        shell: bash
        run: |
          set -o pipefail
          node scripts/smoke_manual_studio_macos.mjs 2>&1 | tee macos-studio-smoke.log
      - name: Save macOS native check log
        if: always() && runner.os == 'macOS' && inputs.macos_native_smoke
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-native-smoke-log
          path: |
            macos-native-smoke.log
            macos-studio-smoke.log
            native-smoke-results/
          if-no-files-found: warn
      - name: Install browser and manual builder for UI checks
        if: runner.os == 'Linux'
        run: |
          npx playwright-core install --with-deps chrome
          python -m pip install mkdocs-material
      - name: Check UI, generation, capture, and integrated workflows
        if: runner.os == 'Linux'
        run: |
          npm run manual:check -- --group unit
          npm run manual:check-ui
          npm run manual:check-generation
          npm run manual:check-capture
          npm run manual:check -- --group smoke
      - name: Build Manual Studio and CLI
        run: cargo build --locked --release --target ${{ matrix.target }} -p manual-studio -p manual-core
      - name: Package applications
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/package_release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: manual-studio-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_notes_path="docs/release-notes-${RELEASE_TAG#v}.md"
            if [ -f "$release_notes_path" ]; then
              gh release create "$RELEASE_TAG" --verify-tag --title "Munin Manual Studio $RELEASE_TAG" --notes-file "$release_notes_path"
            else
              gh release create "$RELEASE_TAG" --verify-tag --title "Munin Manual Studio $RELEASE_TAG" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" release/*.zip --clobber
