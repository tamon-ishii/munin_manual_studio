<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Munin Manual Studio — 撮影</title><style>
*{box-sizing:border-box}body{margin:0;padding:10px;font:13px system-ui,sans-serif;background:#f3f6f2;color:#26342f}main{display:flex;flex-wrap:wrap;gap:8px;align-items:center}header,small,#capture-error{width:100%}header{cursor:move;font-size:12px}button{font:inherit;border:1px solid #648473;border-radius:6px;padding:8px 10px;cursor:pointer}#capture-now{background:#285d46;color:white;flex:1}#capture-cancel{background:white;color:#26342f}small{color:#5b6b60}#capture-error{color:#a22;white-space:pre-wrap;margin:0}button:disabled{opacity:.5}
#capture-history-panel{width:100%;border-top:1px solid #ccd8cf;padding-top:8px}h2{font-size:12px;margin:0 0 6px}#capture-history-empty{margin:12px 0;color:#5b6b60}#capture-history{height:170px;overflow:auto;margin:0;padding:0;list-style:none;scrollbar-gutter:stable}#capture-history li{display:grid;grid-template-columns:24px 40px minmax(0,1fr);gap:5px;padding:5px 2px;border-bottom:1px solid #e0e7e1;line-height:1.4}#capture-history .history-number,#capture-history time{color:#5b6b60;font-variant-numeric:tabular-nums;font-size:11px}#capture-history .history-label{white-space:pre-wrap;overflow-wrap:anywhere}#capture-history-note,#capture-history-status{margin:5px 0 0;color:#5b6b60;font-size:11px}
#capture-depth-field{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}#capture-depth{width:80px;font:inherit;padding:5px;border:1px solid #648473;border-radius:4px}#capture-depth-note{font-size:11px}</style></head><body><main id="recording-control"><header data-tauri-drag-region>対象アプリの操作が終わったら　⠿</header><button id="capture-now" type="button">スクリーンショットを実行</button><button id="capture-cancel" type="button">キャンセル（Esc）</button><small>Escで撮影を中止してStudioに戻れます。</small><label id="capture-depth-field">UI探索の最大階層<input id="capture-depth" type="number" min="1" max="128" step="1" value="64" required aria-label="UI探索の最大階層" /></label><small id="capture-depth-note">1〜128階層。この撮影に適用し、次回の設定として保存します。</small><button id="capture-settings-retry" type="button" hidden>設定を再読み込み</button><section id="capture-history-panel" aria-labelledby="capture-history-heading"><h2 id="capture-history-heading">操作履歴（0件）</h2><p id="capture-history-empty">操作するとここに履歴が表示されます。</p><ol id="capture-history" aria-label="録画した操作の履歴" hidden></ol><p id="capture-history-note" hidden>最新100件を表示しています。</p><p id="capture-history-status" role="status"></p></section><p id="capture-error" role="alert"></p></main><script type="module" src="/src/recordingControl.ts"></script></body></html>
